services:
  migrate:
    image: ${API_IMAGE:?Set API_IMAGE}
    entrypoint: ["/app/efbundle"]
    environment:
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING}
    profiles: ["migration"]
    restart: "no"

  api:
    image: ${API_IMAGE:?Set API_IMAGE}
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE}
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    environment:
      API_BASE_URL: http://api:8080
    expose: ["3000"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports: ["8080:80"]
    volumes:
      - ./infrastructure/nginx/one-competitions.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    restart: unless-stopped
