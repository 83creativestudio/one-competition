name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: dotnet restore OneCompetitions.slnx
      - run: dotnet build OneCompetitions.slnx --no-restore
      - run: dotnet test OneCompetitions.slnx --no-build
      - run: dotnet tool restore
      - run: ASPNETCORE_ENVIRONMENT=Development dotnet ef migrations has-pending-model-changes --project apps/api/OneCompetitions.Infrastructure --startup-project apps/api/OneCompetitions.Api
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Validate production compose
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
        env:
          API_IMAGE: one-competitions-api:test
          WORKER_IMAGE: one-competitions-worker:test
          WEB_IMAGE: one-competitions-web:test
          PRODUCTION_ENV_FILE: .env.production.example
