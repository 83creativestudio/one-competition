name: one-competitions-staging

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: one_competitions
      POSTGRES_USER: one
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one -d one_competitions"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    restart: unless-stopped

  api:
    image: one-competitions-api:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: ../../..
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env.staging
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=one_competitions;Username=one;Password=${POSTGRES_PASSWORD}
      REDIS_CONNECTION_STRING: redis:6379,password=${REDIS_PASSWORD}
      OBJECT_STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/storage
      DISTRIBUTED_LOCK_PROVIDER: redis
    volumes:
      - object-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: one-competitions-worker:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: ../../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: .env.staging
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=one_competitions;Username=one;Password=${POSTGRES_PASSWORD}
      REDIS_CONNECTION_STRING: redis:6379,password=${REDIS_PASSWORD}
      OBJECT_STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/storage
      DISTRIBUTED_LOCK_PROVIDER: redis
    volumes:
      - object-storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: one-competitions-web:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: ../../..
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ../../../infrastructure/nginx/one-competitions.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-storage:
