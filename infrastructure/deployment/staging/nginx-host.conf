server {
    listen 80;
    listen [::]:80;
    server_name competition.onedigital.com.cy;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name competition.onedigital.com.cy;

    ssl_certificate /etc/letsencrypt/live/competition.onedigital.com.cy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/competition.onedigital.com.cy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "ONE. Competitions staging";
    auth_basic_user_file /etc/nginx/.htpasswd-one-competitions;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
